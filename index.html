<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>번역자막</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: env(safe-area-inset-top) 0 24px; }
  .player[hidden] { display: none; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .player iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sub {
    min-height: 3.2em; margin: 12px 16px 0; padding: 12px 14px; border-radius: 10px;
    background: #1f1f1f; font-size: 20px; line-height: 1.45; text-align: center; word-break: keep-all;
  }
  .src { margin: 6px 16px 0; color: #8a8a8a; font-size: 14px; text-align: center; min-height: 1.4em; }
  .status { margin: 12px 16px 0; color: #aaa; font-size: 13px; }
  .status.err { color: #ff6b6b; }
  form { display: flex; gap: 8px; margin: 16px; }
  input[type="url"] { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #181818; color: inherit; font-size: 16px; }
  button { padding: 12px 16px; border: 0; border-radius: 8px; background: #d97757; color: #fff; font-size: 16px; font-weight: 600; }
  .list { margin: 20px 16px 0; }
  .list h2 { font-size: 15px; color: #aaa; font-weight: 600; margin: 0 0 8px; }
  .list a { display: block; padding: 12px 0; border-top: 1px solid #222; color: inherit; text-decoration: none; }
  .list a small { display: block; color: #888; font-size: 13px; margin-top: 2px; }
  .note { margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; background: #2a2116; color: #f0c48a; font-size: 14px; line-height: 1.5; }
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 16px 0; }
  .ctrl button { padding: 8px 12px; font-size: 15px; background: #333; }
  .ctrl a { color: #d97757; font-size: 14px; }
  #tTime { font-variant-numeric: tabular-nums; color: #ccc; min-width: 3.5em; }
  .line { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #222; font-size: 15px; line-height: 1.45; }
  .line b { color: #888; font-weight: 400; font-variant-numeric: tabular-nums; min-width: 3em; }
  .line.on { color: #d97757; }
  label { display: flex; align-items: center; gap: 6px; margin: 10px 16px 0; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <form id="form">
    <input id="link" type="url" placeholder="유튜브 링크 붙여넣기" autocomplete="off">
    <button>보기</button>
  </form>
  <div class="player" id="playerBox" hidden><div id="yt"></div></div>
  <div id="textMode" hidden>
    <div class="note">연령 제한 영상이라 여기서는 재생할 수 없어요. 유튜브 앱에서 재생하면서 ▶를 눌러 자막 시간을 맞추세요. 대본 줄을 누르면 그 시점으로 맞춰져요.</div>
    <div class="ctrl"><button id="tPlay">▶</button><button id="tBack">-5초</button><button id="tFwd">+5초</button><span id="tTime">0:00</span><a id="tOpen" target="_blank">유튜브에서 이 시점부터 ↗</a></div>
  </div>
  <div class="sub" id="sub"></div>
  <div class="src" id="src"></div>
  <label><input type="checkbox" id="showSrc"> 영어 원문도 보기</label>
  <div class="status" id="status">링크를 넣으면 한국어 자막을 준비해요.</div>
  <div class="list" id="script" hidden><h2>한국어 대본</h2><div id="lines"></div></div>
  <div class="list" id="list" hidden><h2>번역해 둔 영상</h2><div id="items"></div></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let player, segs = [], videoId = null, pollTimer = null;
  // 자막 모드(연령 제한 등 퍼가기 불가 영상): 영상 대신 페이지 자체 시계로 자막을 넘김
  let textMode = false, clockBase = 0, clockAt = null, rendered = 0;
  const now = () => textMode ? clockBase + (clockAt === null ? 0 : (performance.now() - clockAt) / 1000) : player?.getCurrentTime?.() ?? 0;
  function setClock(t) { clockBase = Math.max(0, t); if (clockAt !== null) clockAt = performance.now(); }
  const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

  function enterTextMode() {
    textMode = true;
    clockBase = 0; clockAt = null; rendered = 0;
    $('tPlay').textContent = '▶';
    $('playerBox').hidden = true;
    $('textMode').hidden = false;
    $('script').hidden = false;
  }
  $('tPlay').onclick = () => {
    if (clockAt === null) { clockAt = performance.now(); $('tPlay').textContent = '⏸'; }
    else { clockBase = now(); clockAt = null; $('tPlay').textContent = '▶'; }
  };
  $('tBack').onclick = () => setClock(now() - 5);
  $('tFwd').onclick = () => setClock(now() + 5);

  // youtu.be/ID, watch?v=ID, shorts/ID, 또는 ID 그대로
  function parseId(s) {
    s = (s || '').trim();
    const m = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
    return m ? m[1] : /^[\w-]{11}$/.test(s) ? s : null;
  }

  function setStatus(text, err) {
    $('status').textContent = text;
    $('status').className = 'status' + (err ? ' err' : '');
  }

  function load(id) {
    videoId = id;
    textMode = false;
    $('playerBox').hidden = false;
    $('textMode').hidden = true;
    $('script').hidden = true;
    segs = [];
    $('sub').textContent = '';
    $('src').textContent = '';
    history.replaceState(null, '', '?v=' + id + location.hash); // # 유지: 홈 화면 아이콘에도 비밀키가 남게
    const go = () => {
      if (player) player.loadVideoById(id);
      else player = new YT.Player('yt', {
        videoId: id,
        playerVars: { playsinline: 1, cc_load_policy: 0 },
        events: { onError: (e) => [100, 101, 150].includes(e.data) && enterTextMode() }, // 101·150 = 퍼가기 불가(연령 제한 등)
      });
    };
    window.YT && YT.Player ? go() : (window.onYouTubeIframeAPIReady = go);
    start(id);
  }

  // 단축어가 #k=비밀키&s=맥스튜디오주소 로 넘겨줌 → 한 번 받으면 이 폰에 기억
  const hash = new URLSearchParams(location.hash.slice(1));
  const store = (k, v) => { try { if (v) localStorage.setItem(k, v); return localStorage.getItem(k) || ''; } catch { return v || ''; } };
  const KEY = store('ko-subs-key', hash.get('k'));
  const onPages = location.hostname.endsWith('github.io');
  const STUDIO = store('ko-subs-studio', hash.get('s')).replace(/\/$/, '');

  async function fileId(id) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(KEY + ':' + id));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
  }

  async function start(id) {
    clearTimeout(pollTimer);
    // 1) 미리 번역해 둔 자막 (맥스튜디오가 꺼져 있어도 됨)
    if (onPages && KEY) {
      try {
        const r = await fetch('subs/' + (await fileId(id)) + '.json', { cache: 'no-cache' });
        if (r.ok) {
          segs = await r.json();
          return setStatus('미리 번역된 자막');
        }
      } catch {}
    }
    // 2) 맥스튜디오에서 즉석 번역 — 공개 페이지에서 개인 네트워크로 요청하면 브라우저가 막으므로, 맥스튜디오 페이지로 이동
    if (onPages) {
      if (!STUDIO) return setStatus('미리 번역된 영상이 아니에요 (맥스튜디오 주소가 없어요)', true);
      setStatus('미리 번역된 영상이 아니라 맥스튜디오로 이동해요… (꺼져 있으면 연결 오류가 나요)');
      return location.replace(STUDIO + '/?v=' + id);
    }
    setStatus('자막 받아오는 중… (처음 보는 영상은 10초쯤 걸려요)');
    try {
      const d = await (await fetch('/start?v=' + id)).json();
      if (id !== videoId) return;
      apply(d);
    } catch {
      setStatus('맥스튜디오 번역 서버에 연결할 수 없어요', true);
    }
  }

  async function poll(id) {
    try {
      const d = await (await fetch('/progress?videoId=' + id)).json();
      if (id === videoId) apply(d);
    } catch {
      pollTimer = setTimeout(() => poll(id), 3000);
    }
  }

  function apply(d) {
    if (d.segments) segs = d.segments;
    if (d.error) return setStatus(d.error, true);
    if (d.done) return setStatus('번역 완료');
    setStatus(`번역 중… (${d.doneChunks || 0}/${d.total || '?'}) 앞부분부터 자막이 떠요`);
    pollTimer = setTimeout(() => poll(d.videoId), 2000);
  }

  // 재생 시간에 맞춰 자막 표시
  setInterval(() => {
    if (!segs.length || (!textMode && !player?.getCurrentTime)) return;
    const t = now();
    if (textMode) {
      $('tTime').textContent = mmss(t);
      $('tOpen').href = `https://www.youtube.com/watch?v=${videoId}&t=${Math.floor(t)}s`;
      if (rendered !== segs.length) renderScript();
    }
    let lo = 0, hi = segs.length - 1, i = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (segs[mid].start <= t) { i = mid; lo = mid + 1; } else hi = mid - 1;
    }
    const s = i >= 0 && t <= segs[i].start + segs[i].dur + 0.3 ? segs[i] : null;
    const ko = s ? s.text || '' : '';
    if ($('sub').textContent !== ko) $('sub').textContent = ko;
    const en = s && $('showSrc').checked ? s.src : '';
    if ($('src').textContent !== en) $('src').textContent = en;
    if (textMode) document.querySelectorAll('.line').forEach((el, j) => el.classList.toggle('on', j === i && !!s));
  }, 200);

  function renderScript() {
    rendered = segs.length;
    $('lines').replaceChildren(...segs.map((sg) => {
      const d = document.createElement('div');
      d.className = 'line';
      const b = document.createElement('b');
      b.textContent = mmss(sg.start);
      d.append(b, sg.text || sg.src);
      d.onclick = () => setClock(sg.start);
      return d;
    }));
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = parseId($('link').value);
    if (id) load(id);
    else setStatus('유튜브 링크가 아닌 것 같아요', true);
  });

  // 번역해 둔 영상 목록 (비밀키로 암호화된 list.enc를 풀어서 표시)
  async function loadList() {
    if (!onPages || !KEY) return;
    try {
      const raw = Uint8Array.from(atob(await (await fetch('list.enc', { cache: 'no-cache' })).text()), (c) => c.charCodeAt(0));
      const k = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', new TextEncoder().encode(KEY + ':list')), 'AES-GCM', false, ['decrypt']);
      const items = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12))));
      $('items').replaceChildren(...items.map((it) => {
        const a = document.createElement('a');
        a.href = '?v=' + it.id + location.hash;
        a.textContent = it.title;
        const sm = document.createElement('small');
        sm.textContent = `${it.channel} · ${it.added}`;
        a.append(sm);
        return a;
      }));
      $('list').hidden = !items.length;
    } catch {}
  }
  loadList();

  const q = new URLSearchParams(location.search);
  const first = parseId(q.get('v') || q.get('u') || '');
  if (first) load(first);
</script>
</body>
</html>
